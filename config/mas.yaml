# MAS pipeline configuration
# Controls all MAS agents (C4–C9).
#
# Fairness controls (NFR-006, SRS-015):
#   - model.provider and model.name MUST match config/baseline.yaml.
#   - temperature MUST be identical to baseline temperature.
#   - max_retries and retry_backoff_seconds apply identically.
#
# Each agent reads from this shared config. If an agent ever needs
# a different model (not currently planned), add a per-agent override section.

model:
  # LLM provider adapter.  Supported: openai | anthropic | gemini
  # Must match baseline.yaml provider (FR-027, OPEN-002).
  provider: "gemini"

  # Model name. Must be frozen before running experiments (NFR-008).
  # Must match baseline.yaml model.name for experimental fairness.
  name: "gemini-3.5-flash-lite"

  # Inference parameters — IDENTICAL to baseline for fairness (NFR-006).
  temperature: 0
  max_tokens: 4096
  top_p: null

  # Structured output format.
  response_format: "json_object"

invocation:
  # Maximum retries on LLM API failure (Tech Arch §10).
  max_retries: 5
  retry_backoff_seconds: 2

  # Minimum seconds between consecutive LLM calls per agent instance.
  # Free tier Gemini 3.5 Flash Lite = 15 RPM → 60s / 15 = 4s minimum. Use 5s for safety.
  # Set to 0.0 for paid tier.
  min_request_interval_seconds: 5

  # Seconds to wait on 503 UNAVAILABLE before retrying.
  wait_on_overload_seconds: 10

reader_agent:
  # Prompt template version — update when prompt file changes (OPEN-004).
  prompt_version: "reader_v1"
  system_prompt_file: "config/prompts/reader_system_prompt.txt"

analyst_agent:
  # Prompt template version — update when prompt file changes (OPEN-004).
  prompt_version: "analyst_v1"
  system_prompt_file: "config/prompts/analyst_system_prompt.txt"

generator_agent:
  # Prompt template version — update when prompt file changes (OPEN-004).
  prompt_version: "generator_v1"
  # Smaller max_tokens: one story per call is short.
  max_tokens: 1024
  system_prompt_file: "config/prompts/generator_system_prompt.txt"

reviewer_agent:
  # Prompt template version — update when prompt file changes (OPEN-004).
  prompt_version: "reviewer_v1"
  # Moderate max_tokens: verdict + feedback text.
  max_tokens: 2048
  system_prompt_file: "config/prompts/reviewer_system_prompt.txt"

redundancy_agent:
  # Prompt template version — update when prompt file changes (OPEN-004).
  prompt_version: "redundancy_v1"
  # Larger max_tokens: processes the full story collection.
  max_tokens: 4096
  system_prompt_file: "config/prompts/redundancy_system_prompt.txt"
  # Maximum re-check passes before flagging as unresolved (OPEN-006).
  max_resolution_passes: 2

evaluator_agent:
  # Smaller max_tokens: hallucination check responses are short.
  max_tokens: 512
  hallucination_prompt_file: "config/prompts/evaluator_hallucination_prompt.txt"
  # OPEN-021: whether Redundancy-Unresolved stories count toward redundancy_rate.
  count_unresolved_in_redundancy: false

orchestration:
  # Maximum Generator↔Reviewer iterations per candidate (inclusive of initial attempt).
  # After this limit, the story is flagged Rejected-ManualReview and excluded.
  max_reviewer_iterations: 3

  # Paths (relative to project root, or absolute).
  output_dir: "outputs"
  logs_dir: "logs"

  # Write intermediate results (reader, analyst, generator/reviewer) to disk.
  # Set false only during unit tests or dry runs to avoid disk I/O.
  save_intermediate: true

  # If true, abort the entire run when preprocessing yields zero chunks.
  # If false (default), log a warning and return an empty result.
  abort_on_empty_chunks: false

  # If true, skip a chunk where the Reader produced zero evidence items.
  # If false (default), still attempt Analyst (it may find implicit requirements).
  abort_on_empty_reader: false
