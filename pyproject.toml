[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdd-userstory-mas"
version = "0.1.0"
description = "Extraction of User Stories from Game Design Documents using a Multi-Agent System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfminer.six>=20221105",
    "tiktoken>=0.7",
    "nltk>=3.8",
    "langdetect>=1.0.9",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reportlab>=4.0",  # for generating test PDFs
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
